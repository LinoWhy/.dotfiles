<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
$css
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <aside class="toc-rail" aria-label="目录开关" hidden>
    <button class="toc-toggle" type="button" aria-controls="page-toc" aria-expanded="true" aria-label="收起目录" title="收起目录">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
        <path class="toc-toggle-arrow" d="m15 9-3 3 3 3" />
      </svg>
    </button>
  </aside>
  <div class="toc-backdrop" hidden></div>
  <div class="page-layout">
    <nav id="page-toc" class="page-toc" aria-label="文章目录">
      <div class="toc-heading">本文目录</div>
      $toc
    </nav>
    <main id="main-content" class="prose" tabindex="-1">
$body
    </main>
  </div>
  <dialog class="image-viewer" aria-label="放大图片">
    <div class="image-viewer-content" tabindex="0" role="button" aria-label="点击返回正文"></div>
  </dialog>
  <script>
$js
  </script>
</body>
</html>
